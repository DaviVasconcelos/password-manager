name: CI

on:
  push:
  pull_request:

# Necessário para criar GitHub Releases no job publish-release
permissions:
  contents: write

jobs:
  build-and-test:
    name: Compilar e testar (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Instalar o SDK do .NET 10 (global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Garantir o runtime do .NET 8 (testes)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar ferramentas locais (dotnet-ef)
        run: dotnet tool restore

      - name: Verificar mudanças de modelo pendentes (EF Core)
        run: dotnet ef migrations has-pending-model-changes --project src/PasswordManager.Infrastructure

      - name: Compilar a solution
        run: dotnet build PasswordManager.slnx --configuration Debug -p:Platform=x64

      - name: Executar os testes (Domain/Application/Infrastructure)
        timeout-minutes: 10
        run: dotnet test PasswordManager.slnx --configuration Debug --no-build -p:Platform=x64 --filter "FullyQualifiedName!~PasswordManager.UI.Tests" --logger trx --results-directory TestResults --blame-hang --blame-hang-timeout 60s

      - name: Executar os testes de UI (ViewModels)
        timeout-minutes: 5
        run: dotnet test tests/PasswordManager.UI.Tests/PasswordManager.UI.Tests.csproj --configuration Debug --no-build --logger trx --results-directory TestResults --blame-hang --blame-hang-timeout 60s

      - name: Enviar os resultados dos testes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resultados-dos-testes
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  # Fase D — Distribuição MSI (next-next, sem cert). Gera instalador .msi via WiX Toolset a partir do publish self-contained.
  build-msi:
    name: Gerar MSI (Release)
    runs-on: windows-latest
    timeout-minutes: 15
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Instalar o SDK do .NET 10 (global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Garantir o runtime do .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Resolver versão (git tag)
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          $fullVersion = ""
          $msiVersion = ""
          if ($ref -like "refs/tags/v*") {
            $fullVersion = $ref -replace "refs/tags/v", ""
            # MSI exige x.y.z numérico — remove sufixo pré-release (-alpha, -beta etc) se existir
            $msiVersion = $fullVersion -replace "-.*$", ""
            Write-Host "Tag detectada: v$fullVersion -> MSI $msiVersion"
          } else {
            # Build de branch/PR: usa versão fallback (sem Release). MSI fica 0.1.0 para teste.
            $fullVersion = "0.1.0"
            $msiVersion = "0.1.0"
            Write-Host "Sem tag, usando fallback: $fullVersion"
          }
          if ($msiVersion -notmatch "^\d+\.\d+\.\d+$") {
            throw "Versão MSI inválida: '$msiVersion' (esperado x.y.z). Tag original: '$fullVersion'"
          }
          if ($fullVersion -notmatch "^\d+\.\d+\.\d+(-[0-9A-Za-z\.-]+)?$") {
            throw "Versão completa inválida: '$fullVersion' (esperado SemVer x.y.z[-sufixo])"
          }
          "full=$fullVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "msi=$msiVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "full=$fullVersion msi=$msiVersion (artefatos: PasswordManager-$fullVersion-x64-ptBR.msi + -enUS.msi)"

      - name: Publicar app unpackaged (self-contained win-x64)
        run: dotnet publish src/PasswordManager.UI/PasswordManager.UI.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained -o publish -p:Version=${{ steps.version.outputs.full }} -p:AssemblyVersion=${{ steps.version.outputs.msi }} -p:FileVersion=${{ steps.version.outputs.msi }} -p:InformationalVersion=${{ steps.version.outputs.full }}

      - name: Instalar WiX Toolset
        run: dotnet tool install --global wix --version 5.0.2

      - name: Instalar WiX UI extension
        run: wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Gerar MSIs com WiX (pt-BR + en-US)
        shell: pwsh
        run: |
          $publishDir = (Resolve-Path publish).Path
          $msiVersion = "${{ steps.version.outputs.msi }}"
          $fullVersion = "${{ steps.version.outputs.full }}"
          $msiPtBR = "PasswordManager-$fullVersion-x64-ptBR.msi"
          $msiEnUS = "PasswordManager-$fullVersion-x64-enUS.msi"
          Write-Host "PublishDir: $publishDir"
          Write-Host "MsiVersion: $msiVersion (full $fullVersion)"
          Get-ChildItem $publishDir | Format-Table Name, Length | Out-String -Width 200 | Write-Host
          # Verificar Assets do ícone (correção de ícone ausente)
          if (Test-Path "$publishDir/Assets/logo-password-manager.ico") { Write-Host "Ícone encontrado em publish/Assets/logo-password-manager.ico" } else { Write-Warning "Ícone NÃO encontrado em publish/Assets/" }
          # Gerar AppFiles.wxs via PowerShell (heat removido no WiX v5)
          powershell -ExecutionPolicy Bypass -File installer/generate-AppFiles.ps1 -PublishDir "$publishDir" -Output "installer/AppFiles.wxs"
          if (-not (Test-Path installer/AppFiles.wxs)) { throw "AppFiles.wxs não gerado" }
          Write-Host "AppFiles.wxs gerado:"; Get-Content installer/AppFiles.wxs | Select-Object -First 20 | Out-String | Write-Host
          # Um MSI por idioma (WiX 5 não aceita dois -loc com os mesmos IDs num único build — erro WIX0100).
          # Cada MSI nasce no seu idioma (cultura + .wxl + contrato RTF próprios); a seleção de idioma
          # do instalador (LanguageSelectionDlg) alimenta HKCU\...\installerLanguage para o app ler na 1ª execução.
          $wxsFiles = @("installer/Package.wxs", "installer/AppFiles.wxs", "installer/WixUI_Custom.wxs", "installer/LanguageSelectionDlg.wxs", "installer/VerifyReadyDlg_Custom.wxs")
          wix build -arch x64 -culture pt-BR -d PublishDir="$publishDir" -d MsiVersion="$msiVersion" -d LangId="1046" -d LicenseRtf="installer/License_pt-BR.rtf" -d InstallerLanguage="pt-BR" -o "$msiPtBR" @wxsFiles -ext WixToolset.UI.wixext -loc installer/Loc/Strings_pt-BR.wxl
          if (-not (Test-Path "$msiPtBR")) { throw "MSI não gerado: $msiPtBR" }
          wix build -arch x64 -culture en-US -d PublishDir="$publishDir" -d MsiVersion="$msiVersion" -d LangId="1033" -d LicenseRtf="installer/License_en-US.rtf" -d InstallerLanguage="en-US" -o "$msiEnUS" @wxsFiles -ext WixToolset.UI.wixext -loc installer/Loc/Strings_en-US.wxl
          if (-not (Test-Path "$msiEnUS")) { throw "MSI não gerado: $msiEnUS" }
          Get-ChildItem PasswordManager-*.msi | Format-List Name,Length | Out-String | Write-Host
          # Checksums para conferência do Release (sem cert, usuário pode verificar)
          foreach ($f in Get-ChildItem PasswordManager-*.msi) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)" | Set-Content "$($f.Name).sha256"
            Get-Content "$($f.Name).sha256" | Write-Host
          }

      - name: Enviar artefato MSI
        uses: actions/upload-artifact@v6
        with:
          name: PasswordManager-MSI
          path: |
            PasswordManager-*.msi
            PasswordManager-*.msi.sha256
          if-no-files-found: error
          retention-days: 30

  # Publicação automática: cria GitHub Release quando houver push de tag v*.*.* (ex: v1.0.0)
  # Uso diário continua só commit+push; para publicar: git tag v1.0.0 && git push --tags
  publish-release:
    name: Publicar Release
    runs-on: windows-latest
    timeout-minutes: 10
    needs: build-msi
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Baixar MSI do job anterior
        uses: actions/download-artifact@v6
        with:
          name: PasswordManager-MSI

      - name: Exibir artefatos baixados
        shell: pwsh
        run: Get-ChildItem | Format-List Name,Length | Out-String | Write-Host

      - name: Criar GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $isPrerelease = $tag.Contains("-")
          $prereleaseFlag = if ($isPrerelease) { "--prerelease" } else { "" }
          Write-Host "Criando release $tag (prerelease=$isPrerelease)"
          Get-ChildItem PasswordManager-* | Format-Table Name,Length | Out-String -Width 200 | Write-Host
          # --generate-notes cria notas automáticas; --title usa a tag
          if ($prereleaseFlag) {
            gh release create "$tag" --title "$tag" --generate-notes --prerelease PasswordManager-*.msi PasswordManager-*.msi.sha256
          } else {
            gh release create "$tag" --title "$tag" --generate-notes PasswordManager-*.msi PasswordManager-*.msi.sha256
          }
