name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Compilar e testar (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar o SDK do .NET 10 (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Garantir o runtime do .NET 8 (testes)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar ferramentas locais (dotnet-ef)
        run: dotnet tool restore

      - name: Verificar mudanças de modelo pendentes (EF Core)
        run: dotnet ef migrations has-pending-model-changes --project src/PasswordManager.Infrastructure

      - name: Compilar a solution
        run: dotnet build PasswordManager.slnx --configuration Debug -p:Platform=x64

      - name: Executar os testes (Domain/Application/Infrastructure)
        timeout-minutes: 10
        run: dotnet test PasswordManager.slnx --configuration Debug --no-build -p:Platform=x64 --filter "FullyQualifiedName!~PasswordManager.UI.Tests" --logger trx --results-directory TestResults --blame-hang --blame-hang-timeout 60s

      - name: Executar os testes de UI (ViewModels)
        timeout-minutes: 5
        run: dotnet test tests/PasswordManager.UI.Tests/PasswordManager.UI.Tests.csproj --configuration Debug --no-build --logger trx --results-directory TestResults --blame-hang --blame-hang-timeout 60s

      - name: Enviar os resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-dos-testes
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  # Fase D — Distribuição sideload (MSIX). Gera instalador assinado com cert
  # autoassinado efêmero (CN=PasswordManager, 5 anos) — sem Store, sem segredo
  # commitado. Artefato contém .msix + .cer + Install.ps1 para testadores.
  build-msix:
    name: Gerar MSIX sideload (Release)
    runs-on: windows-latest
    timeout-minutes: 10
    needs: build-and-test
    # Só em push na main e em PRs (evita rodar em pushes de feature branches desenecessários se quiser filtrar)
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar o SDK do .NET 10 (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Garantir o runtime do .NET 8 (testes)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Gerar certificado sideload efêmero
        shell: pwsh
        run: |
          $publisher = "CN=PasswordManager"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature -FriendlyName "PasswordManager Sideload CI" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") -NotAfter (Get-Date).AddYears(5) -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256
          $thumb = $cert.Thumbprint
          Write-Host "Thumbprint: $thumb"
          "SIDELOAD_THUMB=$thumb" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Exportar .cer para incluir no artefato (testador instala em Pessoas Confiáveis)
          $cerPath = "PasswordManager.cer"
          Export-Certificate -Cert "Cert:\CurrentUser\My\$thumb" -FilePath $cerPath -Force
          Write-Host "Cer exportado: $cerPath"
          # Exportar .pfx temporário para assinar (senha vazia)
          $pfxPath = "sideload.pfx"
          $secPwd = New-Object System.Security.SecureString
          Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$thumb" -FilePath $pfxPath -Password $secPwd -Force
          Write-Host "Pfx exportado: $pfxPath"

      - name: Compilar e empacotar MSIX (Release x64)
        shell: pwsh
        run: |
          $thumb = $env:SIDELOAD_THUMB
          if (-not $thumb) { throw "Thumbprint não encontrado em SIDELOAD_THUMB" }
          Write-Host "Usando thumbprint: $thumb"
          $root = (Get-Location).Path
          $pfxPath = Join-Path $root "sideload.pfx"
          $outDir = Join-Path $root "src\PasswordManager.UI\AppPackages\CI\"
          dotnet build src/PasswordManager.UI/PasswordManager.UI.csproj --configuration Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=true -p:PackageCertificateThumbprint=$thumb -p:PackageCertificateKeyFile="$pfxPath" -p:AppxPackageDir="$outDir" -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxBundle=Never
          Get-ChildItem -Recurse src/PasswordManager.UI/AppPackages | Format-Table Name, Length

      - name: Preparar artefato sideload
        shell: pwsh
        run: |
          $dest = "dist-sideload"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # Procurar .msix gerado
          $msix = Get-ChildItem -Recurse -Filter "*.msix" src/PasswordManager.UI/AppPackages | Select-Object -First 1
          if (-not $msix) { throw "MSIX não encontrado em src/PasswordManager.UI/AppPackages" }
          Write-Host "MSIX: $($msix.FullName)"
          Copy-Item $msix.FullName -Destination $dest/
          # Copiar .cer
          if (Test-Path "PasswordManager.cer") { Copy-Item "PasswordManager.cer" -Destination $dest/ }
          # Copiar Install.ps1 gerado pelo packaging (se existir) ou criar um genérico
          $installPs1 = Get-ChildItem -Recurse -Filter "Install.ps1" src/PasswordManager.UI/AppPackages | Select-Object -First 1
          if ($installPs1) { Copy-Item $installPs1.FullName -Destination $dest/ }
          else {
            @'
          param([switch]$Force)
          $cer = Join-Path $PSScriptRoot "PasswordManager.cer"
          $msix = Get-ChildItem -Path $PSScriptRoot -Filter "*.msix" | Select-Object -First 1
          if (-not $msix) { Write-Error "MSIX não encontrado em $PSScriptRoot"; exit 1 }
          Write-Host "Instalando certificado sideload..."
          try { Import-Certificate -FilePath $cer -CertStoreLocation Cert:\CurrentUser\TrustedPeople -ErrorAction Stop | Out-Null; Write-Host "Cert instalado em TrustedPeople." } catch { Write-Host "Tentando LocalMachine..." ; Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null }
          Write-Host "Instalando MSIX: $($msix.Name)"
          Add-AppxPackage -Path $msix.FullName -ForceApplicationShutdown:$Force
          Write-Host "Instalação concluída."
          '@ | Set-Content -Path "$dest/Install.ps1" -Encoding UTF8
          }
          # Copiar dependências se houver pasta Dependencies
          $dep = Get-ChildItem -Recurse -Directory -Filter "Dependencies" src/PasswordManager.UI/AppPackages | Select-Object -First 1
          if ($dep) { Copy-Item $dep.FullName -Destination "$dest/Dependencies" -Recurse -Force }
          Get-ChildItem $dest | Format-Table Name, Length
          Write-Host "Conteúdo pronto em $dest"

      - name: Enviar artefato MSIX sideload
        uses: actions/upload-artifact@v4
        with:
          name: PasswordManager-MSIX-sideload
          path: dist-sideload/*
          if-no-files-found: error
          retention-days: 30
